# LR-XMP-Mimic 本地目录限制 —— 可选配置样例
#
# 安装方法
# --------
# 1. 复制这一份到工作台的数据目录，去掉 .example：
#
#      cp apps/workbench/folder-library.example.yaml \
#         ~/lr-xmp-mimic-runtime-data/workbench/folder-library.yaml
#
#    （如果设了 LR_XMP_MIMIC_RUNTIME_DATA_ROOT，就放到那个根下的 workbench/。）
#
# 2. 改下面的 roots 为你要开放的照片目录。存在此文件后，访问范围会
#    从默认的 Runtime OS 账号可访问路径收窄为这里列出的目录。可以写多条。
#
# 3. 保存即生效，**不需要重启 MCP**：配置按文件修改时间读取。
#
# 其它
# ----
# * 也可以用 JSON 写同一份内容，文件名用 folder-library.json（JSON 是合法 YAML）。
# * 路径也可以用环境变量指定：LR_XMP_MIMIC_FOLDER_CONFIG=/path/to/config.yaml
# * 优先级：环境变量 > 本文件 > 旧的 folder-roots.json > Runtime 主机 OS 可访问路径。
#   本文件一旦存在，旧的 folder-roots.json 就被完全忽略（不会删除它）。
# * 这里只放"能读哪些目录"，不放任何修图参数或风格信息。

# 限制后的根目录：只有这些目录及其子路径可以被读取。
# 写绝对路径即可；~ 会被展开；符号链接会在加载时解析成真实路径。
roots:
  - /path/to/Photos
  - /another/allowed/photo-root

# 允许出现在目录列表与预览里的扩展名。
# 大小写不敏感；缺前导点会自动补上；重复项会去掉；顺序保留。
# 清空这一项（extensions: []）会被当成配置错误，而不是"什么都不给看"。
extensions:
  - .jpg
  - .jpeg
  - .png
  - .tif
  - .tiff
  - .cr2
  - .cr3
  - .nef
  - .arw
  - .raf
  - .rw2
  - .dng

# 是否递归扫描子目录。
# false（默认）：点开某个目录只列出它这一层的图片。
# true：连同所有子目录一起列出（最多 2000 个文件、8 层深，触顶会标 truncated）。
# 无论哪种，隐藏目录、*.lrdata / *.lrprev / *.lrcat 都不会被进入。
recursive: false
